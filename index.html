// Administração (acesso total): a Tia Bruna, dona da escola, e o usuário admin. As outras professoras são cadastradas por elas no sistema.

let papel = 'responsavel', meuNome = '', profsAdmin = [], primeiroAcessoProf = false;
const PROFESSORA_VE_ALUNOS = true; // true = a professora vê a aba Alunos (sem atestados, sem financeiro e sem cadastros)
const RESERVADOS = ['bruna', 'admin'];
// Dados da escola usados no aviso de privacidade. Preencha o contato (WhatsApp ou e-mail) para pedidos sobre dados.
const ESCOLA = { nome: 'SPLASH! Natação', contato: 'WhatsApp +55 (85) 8841-9625', site: '' }; // site: endereço do sistema (se vazio, usa o endereço aberto agora)

const FINANCEIRO = { valorPadrao: 0, vencimentoPadrao: 10 };

const WHATS_PROFS = { 'Tia Bruna': '', 'Tia Auri': '' };
let currentUserData = null, unsubs = [], registrando = false, turmaAtual = null, ultimaVisita = 0, turmasAdmin = [], msgAviso = '';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtData = d => d ? esc(String(d).split('-').reverse().join('/')) : '';
const hojeISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
let editandoId = null, unsubMens = null, respAdmin = [], faltasAdmin = [], mensAdmin = {}, mesAl = hojeISO().slice(0, 7), filtroAl = 'todos', mesPai = hojeISO().slice(0, 7), mensPai = {}, histArq = [], mesHist = hojeISO().slice(0, 7), buscaHist = '';
const cancelarListeners = () => { unsubs.forEach(u => u()); unsubs = []; if (unsubMens) { unsubMens(); unsubMens = null; } };

// Última visita do responsável (para marcar turmas novas)
const chaveVisita = () => `splash_visto_${currentUserData.uid}`;
function lerVisita() { try { return Number(localStorage.getItem(chaveVisita())) || Date.now(); } catch (e) { return Date.now(); } }
function salvarVisita() { if (!currentUserData?.uid) return; try { localStorage.setItem(chaveVisita(), Date.now()); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') salvarVisita(); });
window.addEventListener('pagehide', salvarVisita);

// ===== SESSÃO =====
onAuthStateChanged(auth, async (user) => {
    cancelarListeners();
    document.body.classList.toggle('logado', !!user);
    document.body.classList.remove('dona');
    document.body.classList.remove('ve-alunos');
    $('fab').style.display = 'none';
    if (!user) {
        $('login-screen').style.display = 'block';$('app-screen').style.display = 'none';
        currentUserData = null;
        $('user-name-display').innerHTML = "Faça login para continuar";
        return;
    }
    $('login-screen').style.display = 'none';$('app-screen').style.display = 'block';
    if (registrando) return; // o cadastro chama iniciarPai() quando terminar de salvar o perfil

    papel = 'responsavel'; meuNome = ''; primeiroAcessoProf = false;
    if (ADMIN_EMAILS[user.email]) { papel = 'admin'; meuNome = ADMIN_EMAILS[user.email]; }
    else {
        try {
            const ps = await getDoc(doc(db, "professoras", user.uid));
            if (ps.exists() && ps.data().ativo !== false) { papel = 'professora'; meuNome = ps.data().nome || 'Professora'; primeiroAcessoProf = ps.data().primeiro_acesso === true; }
        } catch (e) { console.error(e); }
    }
    document.body.classList.toggle('dona', papel === 'admin');
    document.body.classList.toggle('ve-alunos', papel === 'admin' || (papel === 'professora' && PROFESSORA_VE_ALUNOS));
    if (papel !== 'responsavel') {
        $('user-name-display').innerHTML = `${papel === 'admin' ? '🛠️ Administração' : '🏊‍♀️ Painel da Professora'} <b>${esc(meuNome)}</b>`;
        $('admin-panel').style.display = 'block';$('parent-panel').style.display = 'none';
        window.mudarAbaAdmin('admin-turmas');
        ouvirTurmas('lista-admin-turmas', renderAdmin);
        vistoAdmin = lerVistoAdmin();
        ouvirAgendamentosAdmin();
        ouvirAlunosAdmin();
        ouvirHistorico();
        if (papel === 'admin') ouvirPlanos();
        ouvirGrade();
        ouvirProfs();
        ouvirEventos();
        ouvirAceites();
        if (papel === 'professora' && primeiroAcessoProf) iniciarWizard([{ t: 'senha' }], 'professoras');
    } else {
        iniciarPai(user);
    }
});

async function iniciarPai(user) {
    $('admin-panel').style.display = 'none';$('parent-panel').style.display = 'block';
    try {
        const snap = await getDoc(doc(db, "responsaveis", user.uid));
        currentUserData = snap.exists() ? snap.data() : { nome_responsavel: "Responsável" };
    } catch (err) {
        console.error("Erro ao buscar perfil:", err);
        currentUserData = { nome_responsavel: "Responsável" };
    }
    const d = currentUserData;
    d.uid = user.uid;
    ultimaVisita = lerVisita();
    try { const as = await getDocs(query(collection(db, "aceites"), where("id_responsavel", "==", user.uid))); aceitesPai = as.docs.map(x => x.data()); } catch (e) { console.error(e); }
    const pend = pendencias(d);
    if (pend.length) iniciarWizard(pend, 'responsaveis');
    if (!d.criancas) d.criancas = d.nome_crianca ? [d.nome_crianca] : [];
    $('user-name-display').innerHTML = `🌊 Olá, <b>${esc(d.nome_responsavel)}</b>`;
    window.mudarAbaPai('pai-aulas');
    ouvirTurmas('lista-aulas-disponiveis', renderPais);
    ouvirPagamentosPai();
    ouvirPlanosPai();
    ouvirFixasPai();
    ouvirFaltasPai();
    ouvirEventos();
    carregarMeusAgendamentos();
    renderizarPerfil();
}

// ===== LOGIN / CADASTRO =====
window.addEventListener('DOMContentLoaded', () => {

    $('form-login').onsubmit = (e) => {
        e.preventDefault();
        const usuario = $('login-user').value.trim().toLowerCase();
        signInWithEmailAndPassword(auth, usuario.includes('@') ? usuario : `${usuario}@splash.com`, $('login-pass').value)
            .catch(() => alert("Erro ao entrar. Verifique usuário e senha."));
    };

    $('btn-logout').onclick = () => signOut(auth);

    $('form-nova-turma').onsubmit = async (e) => {
        e.preventDefault();
        const prof = meuNome;
        if (!prof) return alert("Apenas professoras podem criar turmas.");
        if (editandoId) {
            const vagas = parseInt($('turma-vagas').value);
            const atual = turmasAdmin.find(x => x.id === editandoId);
            if (atual && vagas < atual.vagas_ocupadas) return alert(`Já existem ${atual.vagas_ocupadas} aluno(s) agendado(s). O total de vagas não pode ser menor que isso.`);
            try {
                await updateDoc(doc(db, "turmas", editandoId), { data: $('turma-data').value, horario: $('turma-horario').value, nivel:$('turma-nivel').value, capacidade_maxima: vagas, professora: profsForm() });
                resetarForm();
                window.mudarAbaAdmin('admin-turmas');
                alert("Turma atualizada!");
            } catch (err) { alert("Erro ao atualizar turma: " + (err.code || err.message)); }
            return;
        }
        try {
            const nova = {
                professora: profsForm(),
                data: $('turma-data').value,
                horario: $('turma-horario').value,
                nivel: $('turma-nivel').value,
                capacidade_maxima: parseInt($('turma-vagas').value),
                vagas_ocupadas: 0,
                criado_em: Date.now()
            };
            await addDoc(collection(db, "turmas"), nova);
            e.target.reset();
            window.mudarAbaAdmin('admin-turmas');
            if (confirm("Nova turma liberada! Deseja avisar os pais pelo WhatsApp agora?")) abrirAviso(nova);
        } catch (err) {
            alert("Erro ao salvar turma: " + (err.code || err.message));
        }
    };
});

function trocarAba(painel, secao, abaId) {
    window.scrollTo({ top: 0 });
    document.querySelectorAll('.' + secao).forEach(el => el.style.display = 'none');
